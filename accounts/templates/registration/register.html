{% extends 'blrb_app/base.html' %}

{% block content %}

{% if form.errors %}
<p>There is a problem with your username or password.</p>
<p>Please try again</p>
{% endif %}

<form action="{% url 'accounts:register' %}" method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button name="submit">register</button>
</form>

{% endblock content %}
