{% extends 'blrb_app/base.html' %}

{% block page_header %}
<h2>Search results</h2>
<a href="{% url 'blrb_app:book_list' %}">reset filters</a>
{% endblock page_header %}

{% block content %}
<section class="text-center mb-2">
    <div class="container">
        <div class="row">
            {% for result in search_results %}
            <div class="col-md-2">
                <a href="{% url 'blrb_app:book' result.id %}" class="text-reset" style="text-decoration: none;">
                    <div class="card">
                        <img src="https://wallpapers.com/images/hd/red-leather-blank-book-cover-ja6121mqrx4crxz2-ja6121mqrx4crxz2.jpg"
                            alt="Book tumbnail">
                    </div>
                    <small>
                        <p>{{result.title}}</p>
                    </small>
                </a>
            </div>

            {% empty %}
            <h4 class="list-group-item border-0">
                No books were found
                <a href="{% url 'blrb_app:new_book' %}">Add book</a>
            </h4>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock content %}
