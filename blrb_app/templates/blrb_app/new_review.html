{% extends 'blrb_app/base.html' %}

{% block content %}
<a href="{% url 'blrb_app:new_review' book.id %}">{{Book.title}}</a>
<h2>write a review:</h2>
<form action="{% url 'blrb_app:new_review' book.id %}" method="post">
    {% csrf_token %}
    {{form.as_div}}
    <button name="submit">Add review</button>
</form>
{% endblock content %}
